<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Interest Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator-card">
    <h1>Simple Interest Calculator</h1>

    <form id="interest-form">
      <label for="principal">Principal amount</label>
      <input id="principal" type="number" min="0" step="0.01" placeholder="Enter principal" required>

      <label for="rate">Annual interest rate (%)</label>
      <input id="rate" type="number" min="0" step="0.01" placeholder="Enter interest rate" required>

      <label for="time">Time (years)</label>
      <input id="time" type="number" min="0" step="0.01" placeholder="Enter time in years" required>

      <button type="submit">Calculate</button>
    </form>

    <section id="results" class="results" aria-live="polite" hidden>
      <p>Simple interest: <strong id="interest">0.00</strong></p>
      <p>Total amount: <strong id="total">0.00</strong></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
